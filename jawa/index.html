<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Pernikahan Raka & Sinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #4a2e1b;
  --bg2: #2e1c10;
  --card: #fffdf8;
  --accent: #8a5a2b;
  --accent2: #6e4520;
  --accent-soft: #f0e2c8;
  --text: #4a3826;
  --muted: #9a8567;
  --script: #7a4f22;
  --line: #e8d9bd;
  --cover-bg: linear-gradient(165deg,#4a2e1b,#241408);
  --cover-text: #f5e8d0;
  --cover-line: rgba(245,232,208,.25);
  --btn-bg: #8a5a2b;
  --btn-text: #ffffff;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
.wrap{max-width:480px;margin:0 auto;position:relative;z-index:2;background:var(--bg)}
.cover{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--cover-bg);color:var(--cover-text);text-align:center;padding:28px;transition:opacity .8s ease}
.cover.open{opacity:0;pointer-events:none}
.cover-inner{max-width:380px;width:100%}
.cover-eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:12px;opacity:.85}
.cover-names{font-family:'Great Vibes',cursive;font-size:58px;margin:12px 0;color:var(--script);line-height:1.25}
.cover-date{font-family:'Playfair Display',serif;font-size:15px;letter-spacing:1px}
.cover-guest{margin:26px 0 6px;padding:18px 10px;border-top:1px solid var(--cover-line);border-bottom:1px solid var(--cover-line)}
.cover-guest p{font-size:13px;opacity:.85}
#guestName{font-family:'Playfair Display',serif;font-size:27px;margin-top:6px;color:var(--script);word-wrap:break-word}
.btn-open{margin-top:20px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:999px;padding:14px 44px;font-size:15px;font-weight:600;letter-spacing:1px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.cover-note{margin-top:16px;font-size:11px;opacity:.7}
section{padding:54px 26px;text-align:center;position:relative}
.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:11px;color:var(--accent);font-weight:600}
.section-title{font-family:'Playfair Display',serif;font-size:30px;margin:8px 0 16px;color:var(--text)}
.names{font-family:'Great Vibes',cursive;font-size:54px;color:var(--script);line-height:1.3}
.hero{padding:84px 26px 60px}
.hero .date{font-family:'Playfair Display',serif;letter-spacing:1px;margin-top:12px;font-size:16px}
.divider{width:60px;height:2px;background:var(--accent);margin:20px auto;border-radius:2px;opacity:.65}
.verse{font-style:italic;font-size:14px;color:var(--muted);max-width:350px;margin:0 auto}
.person{margin:28px 0}
.avatar{width:94px;height:94px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:38px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:3px solid var(--accent-soft)}
.person h3{font-family:'Playfair Display',serif;font-size:24px}
.person p{font-size:14px;color:var(--muted);margin-top:6px}
.amp{font-family:'Great Vibes',cursive;font-size:46px;color:var(--accent);margin:6px 0}
.date-big{font-family:'Playfair Display',serif;font-size:19px;margin-bottom:4px}
.countdown{display:flex;justify-content:center;gap:10px;margin:22px 0;flex-wrap:wrap}
.countdown div{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:68px;padding:12px 6px;box-shadow:0 6px 18px rgba(0,0,0,.07)}
.countdown span{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;display:block;color:var(--text)}
.countdown small{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.btn{display:inline-block;background:var(--btn-bg);color:var(--btn-text);border-radius:999px;padding:12px 34px;font-size:14px;font-weight:600;text-decoration:none;letter-spacing:.5px;border:none;cursor:pointer;margin-top:12px}
.btn.small{padding:9px 26px;font-size:13px}
.event-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 20px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,.07)}
.event-card h3{font-family:'Playfair Display',serif;font-size:24px;color:var(--accent2);margin-bottom:8px}
.e-date{font-weight:600}
.e-time{color:var(--muted);font-size:14px}
.e-place{margin:10px 0 4px;font-size:14px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gallery div{aspect-ratio:3/4;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Great Vibes',cursive;font-size:28px;color:rgba(255,255,255,.92);text-shadow:0 2px 8px rgba(0,0,0,.3)}
.gift-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.gift-card .bank{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.gift-card .rek{font-family:'Playfair Display',serif;font-size:25px;letter-spacing:2px;margin:8px 0 2px;color:var(--text)}
.gift-card .an{font-size:14px;color:var(--muted)}
.muted{font-size:14px;color:var(--muted)}
form input,form select,form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;font-family:'Inter',sans-serif;margin:8px 0;background:#fff;color:#333}
form textarea{resize:vertical}
footer{padding:54px 26px 72px;text-align:center;background:var(--bg2)}
footer .thanks{font-family:'Great Vibes',cursive;font-size:42px;color:var(--script);margin:14px 0 4px}
footer .credit{font-size:11px;color:var(--muted);margin-top:24px;letter-spacing:1px}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.reveal.shown{opacity:1;transform:none}


body{background:
radial-gradient(circle at 18% 22%,rgba(255,255,255,.05) 0 2px,transparent 3px),
radial-gradient(circle at 72% 58%,rgba(255,255,255,.05) 0 2px,transparent 3px),
radial-gradient(circle at 40% 82%,rgba(255,255,255,.05) 0 2px,transparent 3px),
repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 16px),
repeating-linear-gradient(-45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 16px),
linear-gradient(165deg,var(--bg),var(--bg2))}
.wrap{background:transparent}

#fx2{position:fixed;inset:0;z-index:4;pointer-events:none}
.batikshift{position:fixed;inset:-70px;z-index:1;pointer-events:none;opacity:.55;
  background:repeating-linear-gradient(45deg,rgba(120,72,40,.07) 0 14px,transparent 14px 34px),repeating-linear-gradient(-45deg,rgba(120,72,40,.07) 0 14px,transparent 14px 34px);
  animation:batikSlide 42s linear infinite}
@keyframes batikSlide{from{background-position:0 0,0 0}to{background-position:130px 130px,-130px 130px}}
.melati{position:fixed;top:0;z-index:5;pointer-events:none;transform-origin:top center;animation:melSway 5.5s ease-in-out infinite alternate}
.melati u{display:block;width:2px;height:120px;margin:0 auto;background:linear-gradient(#7d8f5f,rgba(125,143,95,0))}
.melati i{display:block;width:9px;height:9px;margin:2px auto;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#e7dfcb);box-shadow:0 0 6px rgba(255,255,255,.75)}
@keyframes melSway{from{transform:rotate(-4.5deg)}to{transform:rotate(4.5deg)}}

/* Kolom ucapan (DEMO: tanpa penyimpanan) */
.ucapan-list{margin-top:20px;display:flex;flex-direction:column;gap:12px;text-align:left}
.ucapan-item{background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.ucapan-item strong{font-size:14px}
.ucapan-item .ucapan-tgl{font-size:11px;opacity:.55;margin-left:8px}
.ucapan-item p{font-size:13.5px;margin:4px 0 0}
.ucapan-note{font-size:11px;opacity:.5;margin-top:10px;text-align:center}

/* ===== MU-UPGRADE premium 2026-10-29: kartu kaca, glow, kilau, love story ===== */
@keyframes muFadeUp{from{opacity:0;transform:translateY(34px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes muShine{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
.cover-inner{position:relative;z-index:2;background:color-mix(in srgb, var(--card) 82%, transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid color-mix(in srgb, var(--accent) 55%, transparent);border-radius:22px;padding:40px 26px 32px;box-shadow:0 24px 60px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.28);animation:muFadeUp 1.1s cubic-bezier(.22,.8,.3,1) .3s backwards}
.gallery div{position:relative;overflow:hidden}
.gallery div::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-130%);animation:muShine 4.8s ease-in-out infinite;pointer-events:none}
.event-card,.gift-card,.countdown div{transition:transform .3s ease,box-shadow .3s ease}
.event-card:hover,.gift-card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,.12)}
.countdown div{border-color:color-mix(in srgb, var(--accent) 35%, transparent)}
.ls-list{margin-top:8px;display:flex;flex-direction:column;gap:18px;text-align:left}
.ls-item{position:relative;background:color-mix(in srgb, var(--card) 88%, transparent);border:1px solid var(--line);border-radius:16px;padding:18px 18px 18px 20px;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.ls-item::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--accent)}
.ls-year{display:inline-block;background:var(--accent);color:#fff;font-size:12px;letter-spacing:1.5px;font-weight:600;border-radius:999px;padding:4px 14px;margin-bottom:8px}
.ls-item h3{font-size:19px;margin-bottom:4px}
.ls-item p{font-size:14px;color:var(--muted)}

.divider{position:relative;width:150px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.9}
.divider::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--accent);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 3px var(--bg)}

.wrap{background:radial-gradient(600px 300px at 15% -5%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),radial-gradient(500px 260px at 90% 20%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%),linear-gradient(rgba(46,28,16,.35),rgba(46,28,16,.35))}


/* ===== MU-UPGRADE2 ornamen & animasi (2026-10-29): aset SVG transparan per tema ===== */
@keyframes muSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes muSwayR{0%,100%{transform:scaleX(-1) rotate(-4deg)}50%{transform:scaleX(-1) rotate(4deg)}}
@keyframes muDrift{from{background-position:0 0}to{background-position:120px 120px}}
@keyframes muFall{0%{transform:translateY(-10vh) rotate(0deg)}100%{transform:translateY(112vh) rotate(340deg)}}
.mu-orn{position:absolute;width:74px;height:74px;pointer-events:none;z-index:1;animation:muSway 3.8s ease-in-out infinite alternate;transform-origin:top center}
.mu-orn.tl{top:12px;left:12px}
.mu-orn.tr{top:12px;right:12px;animation-name:muSwayR}
.mu-orn.bl{bottom:12px;left:12px;animation-duration:4.6s}
.mu-orn.br{bottom:12px;right:12px;animation-name:muSwayR;animation-duration:4.6s}
section::before{content:"";position:absolute;top:12px;right:14px;width:82px;height:82px;background:url(./img/ornamen.svg) center/contain no-repeat;opacity:.22;pointer-events:none;z-index:0}
section:nth-of-type(even)::before{right:auto;left:14px;transform:scaleX(-1)}
.mu-edge{display:none}
@media(min-width:760px){.mu-edge{display:block;position:fixed;width:120px;height:120px;pointer-events:none;z-index:3;animation:muSway 4.4s ease-in-out infinite alternate;transform-origin:top center}
.mu-edge.l{left:6px;top:22%}
.mu-edge.r{right:6px;top:56%;animation-name:muSwayR}}
.mu-drop{position:fixed;top:-10vh;z-index:999;pointer-events:none;background:url(./img/ornamen.svg) center/contain no-repeat;opacity:.8;animation:muFall linear infinite}

.cover::before{content:"";position:absolute;inset:0;background:url(./img/ornamen.svg) 0 0/120px repeat;opacity:.1;pointer-events:none;animation:muDrift 26s linear infinite}

</style>
<style>
/* MUSIK LATAR (Bensound Tenderness, instrumental gratis) */
.mu-music-btn{position:fixed;right:16px;bottom:18px;z-index:9999;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.65);background:rgba(0,0,0,.45);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mu-music-btn[hidden]{display:none}
.mu-music-btn.paused{opacity:.6}
</style>
<style>
/* ===== MU-UPGRADE3 Jawa premium 2026-10-30: batik parang, gapuro, renda, gunungan ===== */
/* 1. Background: tile batik parang menggantikan garis diagonal .batikshift */
.batikshift{background-image:url(./img/bg-batik-parang.webp);background-size:400px 400px;background-repeat:repeat;opacity:.5;animation:muBatikDrift 180s linear infinite}
@keyframes muBatikDrift{from{background-position:0 0}to{background-position:400px 400px}}
/* Vignette krem lembut: tengah terang tempat nama, batik terlihat ke arah tepi */
.cover{background:radial-gradient(ellipse 90% 62% at 50% 42%,rgba(245,232,208,.16),rgba(245,232,208,0) 70%),linear-gradient(165deg,rgba(74,46,27,.90),rgba(36,20,8,.93)),url(./img/bg-batik-parang.webp);background-size:auto,auto,400px 400px;background-repeat:no-repeat,no-repeat,repeat}
.hero{background:radial-gradient(ellipse 88% 70% at 50% 30%,rgba(245,232,208,.12),rgba(245,232,208,0) 70%)}
/* 2. Cover: gapuro atas + renda sudut bawah (ornamen SVG lama disembunyikan, diganti aset baru) */
.cover .mu-orn{display:none}
.mu-arch{position:absolute;top:0;left:50%;width:min(320px,84vw);height:auto;z-index:1;pointer-events:none;transform:translateX(-50%);animation:muArchIn 1.1s ease-out .1s backwards,swayArch 7s ease-in-out 1.2s infinite alternate}
@keyframes muArchIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.mu-corner{position:absolute;bottom:8px;width:165px;height:auto;z-index:1;pointer-events:none}
.mu-corner.l{left:8px;animation:muCornerIn 1s ease-out .15s backwards,muCornerSway 7s ease-in-out 1.2s infinite alternate}
.mu-corner.r{right:8px;animation:muCornerIn 1s ease-out .3s backwards,muCornerSway 7s ease-in-out 1.35s infinite alternate}
@keyframes muCornerIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes muCornerSway{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
/* 3. Hero: gunungan centerpiece + glow emas */
.mu-gunungan-wrap{position:relative;width:200px;margin:0 auto 6px}
body.mu-opened .mu-gunungan-wrap{animation:muGunIn 1.1s ease-out .15s backwards}
@keyframes muGunIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.mu-gunungan-glow{position:absolute;left:50%;top:50%;width:270px;height:270px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(232,199,102,.38),rgba(232,199,102,.12) 55%,rgba(232,199,102,0) 70%);filter:blur(4px);pointer-events:none;animation:muGlowPulse 4s ease-in-out infinite}
@keyframes muGlowPulse{0%,100%{opacity:.75}50%{opacity:1}}
.mu-gunungan{position:relative;z-index:1;display:block;width:200px;height:auto;margin:0 auto;pointer-events:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));animation:muGunFloat 6s ease-in-out infinite}
@keyframes muGunFloat{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
/* 5. Sentuhan premium: border ganda emas kartu cover + divider emas bawah nama cover */
.cover-inner{outline:1px solid rgba(216,184,119,.55);outline-offset:6px}
.cover-names::after{content:"";display:block;width:64px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,#d8b877,transparent);border-radius:2px}
</style>
